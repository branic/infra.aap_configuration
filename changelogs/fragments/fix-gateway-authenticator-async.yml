    gateway_authenticators - Removed async execution pattern because the
    ``ansible.platform.authenticator`` module is an action plugin that does
    not support async. The role now runs synchronously.
  - >-
    gateway_authenticator_maps - Removed async execution pattern because the
    ``ansible.platform.authenticator_map`` module is an action plugin that does
    not support async. The role now runs synchronously.
